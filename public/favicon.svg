<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a1c1c" />
      <stop offset="100%" stop-color="#4d0d0d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Circular Outer Background -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" />
  <circle cx="64" cy="64" r="54" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8" />

  <!-- Crossed Cleaver and Butcher Knife -->
  <g filter="url(#shadow)" stroke="#fef3c7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Cleaver -->
    <path d="M38 32 L58 52 L52 58 L32 38 Z" fill="#fef3c7" />
    <line x1="32" y1="38" x2="22" y2="28" stroke-width="4" stroke="#d97706" />

    <!-- Right Knife -->
    <path d="M90 32 L70 52 L76 58 L96 38 Z" fill="#fef3c7" />
    <line x1="96" y1="38" x2="106" y2="28" stroke-width="4" stroke="#d97706" />
  </g>

  <!-- Bull Head Silhouette & Horns -->
  <g fill="#ffffff" filter="url(#shadow)">
    <!-- Horns -->
    <path d="M44 54 C34 48 28 36 32 26 C38 30 43 40 48 48 Z" fill="url(#goldGrad)" />
    <path d="M84 54 C94 48 100 36 96 26 C90 30 85 40 80 48 Z" fill="url(#goldGrad)" />
    
    <!-- Skull / Head -->
    <path d="M44 52 C44 42 50 38 64 38 C78 38 84 42 84 52 C84 66 74 76 64 80 C54 76 44 66 44 52 Z" />
    <!-- Snout and Muzzle -->
    <ellipse cx="64" cy="68" rx="8" ry="5" fill="#4d0d0d" />
    <circle cx="60" cy="68" r="1.5" fill="#f59e0b" />
    <circle cx="68" cy="68" r="1.5" fill="#f59e0b" />
    
    <!-- Eye sockets -->
    <ellipse cx="54" cy="52" rx="3" ry="2" fill="#4d0d0d" />
    <ellipse cx="74" cy="52" rx="3" ry="2" fill="#4d0d0d" />
  </g>

  <!-- Bottom Star Accent -->
  <polygon points="64,92 66.5,99 74,99.5 68.5,104 70.5,111 64,107 57.5,111 59.5,104 54,99.5 61.5,99" fill="url(#goldGrad)" />
  <circle cx="46" cy="99" r="2" fill="url(#goldGrad)" />
  <circle cx="82" cy="99" r="2" fill="url(#goldGrad)" />
</svg>
